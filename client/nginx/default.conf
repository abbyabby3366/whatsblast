server {
    listen 80;
    server_name whatsblasting.jona.my;

    client_max_body_size 25m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Host-level Nginx runs outside Docker, so proxy to published localhost ports.
    # Django backend container publishes 127.0.0.1:2553 -> 8000.
    # The trailing slash strips /api/ before forwarding to Django root URLs.
    location /api/ {
        proxy_pass http://127.0.0.1:2553/;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # WhatsApp/Baileys service publishes 127.0.0.1:2124 -> 2524.
    location /wa/ {
        proxy_pass http://127.0.0.1:2124/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # TanStack frontend container publishes 127.0.0.1:25433 -> 25433.
    location / {
        proxy_pass http://127.0.0.1:25433;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
